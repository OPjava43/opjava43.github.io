<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedure Note: Cardioversion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html#home">Home</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <div class="form-section">
            <h2 class="title">Procedure Note: Cardioversion</h2>
            
            <!-- Consent Section -->
            <div data-section="consent"></div>

            <div data-section="timeout"></div>

            <!-- Indication Section -->
            <div data-section="Indication">
                <h3>Indication</h3>
                <button data-text="atrial fibrillation">AFib</button>
                <button data-text="supraventricular tachycardia">SVT</button>
                <button data-text="ventricular tachycardia">VTach</button>
                <textarea></textarea>
            </div>

            <!-- Technique Section -->
            <div data-section="Technique">
                <h3>Technique</h3>
                <button data-text="anteroposterior pad placement">AP pad</button>
                <button data-text="anterolateral pad placement">AL pad</button>
                <button data-text="synchronized cardioversion">synchronized</button>
                <button data-text="150 joules administered">150 J</button>
                <button data-text="200 joules administered">200 J</button>
                <button data-text="patient converted to sinus rhythm after a single attempt">single attempt</button>
                <button data-text="two attempts were required to convert to sinus rhythm">two attempts</button>
                <button data-text="despite cardioversion, the patient did not convert to sinus rhythm">unsuccessful</button>
                <textarea></textarea>
            </div>

            <!-- Post-procedure Section -->
            <div data-section="Post-procedure">
                <h3>Post-procedure</h3>
                <button data-text="patient is awake, alert, oriented and has normal vital signs">AAO nl VS</button>
                <button data-text="patient has maintained sinus rhythm">sinus rhythm</button>
                <button data-text="patient has improved blood pressure following cardioversion">BP improved</button>
                <textarea></textarea>
            </div>

            <!-- Complications Section -->
            <div data-section="Complications">
                <h3>Complications</h3>
                <button data-text="none">none</button>
                <button data-text="the patient experienced hypoxia during procedural sedation">hypoxia</button>
                <button data-text="patient experienced pain during the cardioversion despite analgesia and/or sedation">pain</button>
                <textarea></textarea>
            </div>

            <!-- Provider Section -->
            <div data-section="Provider">
                <h3>Provider</h3>
                <textarea></textarea>
            </div>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <div id="outputArea"></div>
            <button onclick="copyOutput()">Copy to Clipboard</button>
            <button onclick="clearOutput()">Clear</button>

            <!-- New Section for Related Notes -->
            <div class="related-procedures">
                <p>If applicable, press this link to document procedural sedation separately from this procedure: 
                    <a href="Proceduralsedation.html">procedural sedation</a>
                </p>
            </div>
        </div>
    </div>

    <footer>
    </footer>
    
    <script src="jstest/shared.js"></script>
    <script src="jstest/general.js"></script>
    <script>
        loadShared('consent');
        loadShared('timeout');
    </script>
</body>
</html>
