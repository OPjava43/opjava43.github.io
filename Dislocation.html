<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedure Note: Dislocation Reduction</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html#home">Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <h2 class="title">Procedure Note: Dislocation Reduction</h2>
            
            <!-- Consent Section -->
            <div data-section="consent"></div>
            <div data-section="timeout"></div>

            <!-- Location/Type Section -->
            <div data-section="locationType">
                <h3>Location/Type</h3>
                <button >right</button>
                <button >left</button>
                <button >shoulder</button>
                <button >radial head subluxation</button>
                <button >finger</button>
                <button >elbow</button>
                <button >ankle</button>
                <button >hip</button>
                <textarea></textarea>
            </div>

            <!-- Pre-Reduction Exam Section -->
            <div data-section="preReductionExam">
                <h3>Pre-reduction Exam</h3>
                <button data-text="the affected extremity was neurovascularly intact prior to splinting diminished">n/v intact</button>
                <button data-text="there were absent pulses concerning for vascular compromise">absent pulses</button>
                <button data-text="there was diminished capillary refill concerning for vascular compromise">CR</button>
                <button data-text="there was neurologic deficit">neurologic deficit</button>
                <textarea></textarea>
            </div>

            <!-- Analgesia/Sedation Section -->
            <div data-section="analgesiaSedation">
                <h3>Analgesia/Sedation</h3>
                <button data-text="please see procedural sedation note, documented separately">procedural sedation</button>
                <button >morphine</button>
                <button >fentanyl</button>
                <button >dilaudid</button>
                <button >midazolam</button>
                <button data-text="the joint was injected intra-articularly with anesthetic medication">intra-articular joint injection</button>
                <textarea></textarea>
            </div>

            <!-- Technique Section -->
            <div data-section="technique">
                <h3>Technique</h3>
                <button data-text="reduction completed with a combination of traction and countertraction">traction/countertraction</button>
                <button data-text="the Cunningham maneuver was used to reduce the shoulder">Cunningham</button>
                <button data-text="the shoulder was reduced with a combination of external rotation and adduction">external rotation/adduction</button>
                <button data-text="the Stimson maneuver was used to reduce the shoulder">Stimson</button>
                <button data-text="the shoulder was reduced with scapular manipulation and traction">scapular manipulation</button>
                <button data-text="the FARES maneuver was used to reduce the shoulder">FARES</button>
                <button data-text="the hip was flexed to 90 degrees and a combination of traction and internal rotation was performed to achieve reduction">flexion/internal rotation/traction (hip)</button>
                <button data-text="my knee was used a fulcrum and traction was applied to the affected leg to achieve reduction (Captain Morgan technique)">Captain Morgan</button>
                <button data-text="pronation was applied to the affected arm until a palpable click was felt">pronation</button>
                <button data-text="supination and flexion were performed to the affected arm until a palpable click was felt">supination/flexion</button>
                <textarea></textarea>
            </div>

            <!-- Post-Reduction Exam/Tests Section -->
            <div data-section="postReductionExamTests">
                <h3>Post-reduction Exam/Tests</h3>
                <button data-text="the affected extremity was neurovascularly intact following reduction and splinting">n/v intact</button>
                <button data-text="post-reduction XRay was reviewed and demonstrated successful reduction">XR</button>
                <textarea></textarea>
            </div>

            <!-- Immobilization Section -->
            <div data-section="immobilization">
                <h3>Immobilization</h3>
                <button data-text="the extremity was splinted post-reduction">splint</button>
                <button data-text="the extremity was placed in a sling">sling</button>
                <button data-text="a knee immobilizer was placed">knee immobilizer</button>
                <button data-text="the finger was buddy taped">buddy tape</button>
                <textarea></textarea>
            </div>

            <!-- Complications Section -->
            <div data-section="complications">
                <h3>Complications</h3>
                <button >none</button>
                <button data-text="the patient experienced pain despite analgesia">pain</button>
                <button data-text="the patient experienced hypoxia during procedural sedation">hypoxia</button>
                <textarea></textarea>
            </div>

            <!-- Provider Section -->
            <div data-section="provider">
                <h3>Provider</h3>
                <textarea></textarea>
            </div>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <div id="outputArea"></div>
            <button onclick="copyOutput()">Copy to Clipboard</button>
            <button onclick="clearOutput()">Clear</button>
        </div>
    </div>

    <footer>
    </footer>

    <script src="jstest/general.js"></script>
    <script src="jstest/shared.js"></script>
    <script>
        loadShared('consent');
        loadShared('timeout');
    </script>
</body>
</html>
