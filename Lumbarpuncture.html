<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumbar Puncture Procedure</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html#home">Home</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <div class="form-section">

            <h2 class="title">Procedure Note: Lumbar Puncture</h2>
            
            
            <div data-section="consent"></div>

            <div data-section="timeout"></div>
            
            <div data-section="indication">
                <h3>Indication</h3>
                <button data-text="headache">headache</button>
                <button data-text="meningismus with concern for meningitis">meningismus</button>
                <button data-text="altered mental status">altered mental status</button>
                <textarea></textarea>
            </div>
            
            <div data-section="preparation">
                <h3>Preparation</h3>
                <button data-text="the patient was prepared with proper sterile technique and I used sterile gloves/mask throughout the procedure">sterile prep/drape</button>
                <button data-text="patient was placed in the left lateral decubitus">left lateral decubitus</button>
                <button data-text="patient was placed in the right lateral decubitus">right lateral decubitus</button>
                <button data-text="the patient was sitting upright during the position">sitting</button>
                <textarea></textarea>
            </div>
            
            <div data-section="technique">
                <h3>Technique</h3>
                <button data-text="the procedural area was anesthetized with lidocaine prior to the procedure">lidocaine</button>
                <button data-text="the intervertebral space at L3/L4 was accessed">L3/L4</button>
                <button data-text="the intervertebral space at L4/L5 was accessed">L4/L5</button>
                <button data-text="a 20 gauge spinal needle was used">20 g</button>
                <button data-text="a 22 gauge spinal needle was used">22 g</button>
                <button data-text="an opening pressure was recorded and was *** cm H20">opening pressure</button>
                <textarea></textarea>
            </div>
            
            <div data-section="attempts">
                <h3>Attempts</h3>
                <button data-text="the procedure was completed with 1 attempt">1</button>
                <button data-text="the procedure was completed with 2 attempts">2</button>
                <button data-text="the procedure was completed with 3 attempts">3</button>
                <button data-text="no CSF was returned during attempt(s) of lumbar puncture">dry tap</button>
                <textarea></textarea>
            </div>
            
            <div data-section="sample">
                <h3>Sample</h3>
                <button data-text="four vials of clear CSF were sent to the lab">clear</button>
                <button data-text="four vials of purulent CSF were sent to the lab">purulent</button>
                <button data-text="four vials of blood-tinged CSF were sent to the lab">bloody</button>
                <textarea></textarea>
            </div>
            
            <div data-section="complications">
                <h3>Complications</h3>
                <button data-text="none">none</button>
                <button data-text="there was a mild amount of bleeding that was controlled at the time of procedure completion">bleeding</button>
                <button data-text="the patient experienced pain despite anesthetic application">pain</button>
                <textarea></textarea>
            </div>
            
            <div data-section="provider">
                <h3>Provider</h3>
                <textarea></textarea>
            </div>
        </div>

        <div class="output-section">
            <div id="outputArea"></div>
            <button onclick="copyOutput()">Copy to Clipboard</button>
            <button onclick="clearOutput()">Clear</button>
            
            <!-- Macro Buttons Section -->
            
        </div>
    </div>

     <footer>
    </footer>

    <script src="jstest/shared.js"></script>
    <script src="jstest/general.js"></script>
    <script>
        loadShared('consent');
        loadShared('timeout');
    </script>
</body>
</html>
