<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Decision Making</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        /* Optional: small quality-of-life tweaks for details/summary */
        details {
            border-radius: 10px;
            padding: 0.25rem 0.5rem;
            margin: 0.5rem 0;
            background: var(--panel-bg, #f7f7f9);
        }
        summary {
            cursor: pointer;
            list-style: none; /* Remove default marker so only the native arrow shows */
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0;
        }
        summary::-webkit-details-marker {
            margin-right: 0.25rem;
        }
        .section-body {
            padding: 0.25rem 0.25rem 0.75rem 1.25rem;
        }
        .input-group {
            margin: 0.35rem 0 0.85rem;
        }
        .form-section textarea {
            display: block;
            width: 100%;
            min-height: 54px;
            margin-top: 0.35rem;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html#home">Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="form-section">
            <h2 class="title">Medical Decision Making</h2>


            <!-- Data Reviewed (open by default) -->
            <details id="secData" open>
                <summary>
                    <strong><i style="font-size: 1.2em">Data Reviewed</i></strong>
                </summary>
                <div class="section-body">
                    <div data-section="ExternalNotes">
                        <h3 >External Notes</h3>
                        <button data-text="I reviewed previous inpatient and/or outpatient notes to inform my care of the patient in today's visit">inpt/outpt notes</button>
                        <button data-text="I reviewed previous radiology reports which informed today's care of the patient">rad reports</button>
                        <button data-text="I reviewed previous EKG reports">EKG</button>
                        <button data-text="I reviewed previous labs">labs</button>
                        <textarea placeholder="Describe the review of any external notes or records about the patient."></textarea>
                    </div>


                    
                    <div data-section="IndependentHistorian">
                        <h3 >Independent Historian</h3>
                        <button data-text="a history was acquired from EMS personnel including presentation in the field and relevant vital signs and/or labs">EMS</button>
                        <button data-text="relevant history was provided by the patient's spouse that informed decision making">spouse</button>
                        <button data-text="relevant history was provided by the patient's parent(s) that informed decision making">parent</button>
                        <button data-text="relevant history was provided by the patient's family that informed decision making">family</button>
                        <button data-text="relevant history was provided by the patient's outpatient provider that informed decision making">outpatient provider</button>
                        <textarea placeholder="Describe discussion with any independent historian that directly impacted patient care."></textarea>
                    </div>

                    <div data-section="IndependentEkg">
                        <h3 >Independent EKG Interpretation</h3>
                        <button data-text="I have included an independent EKG interpretation in the chart">See chart</button>
                        <button data-text="I have independently reviewed the EKGs with the following interpretation">see below</button>
                        <textarea placeholder="Include EKG Interpretations here."></textarea>
                    </div>

                    <div data-section="IndependentRadiologyReview">
                        <h3>Independent Radiology Review</h3>
                        <button data-text="I have independently reviewed and interpreted the patient's imaging in the chart">see chart</button>
                        <button data-text="I have independently reviewed the patient's radiology tests performed with the following interpretation/findings">see below</button>
                        <h4>Interpretation/Findings</h4>
                        <textarea placeholder="Professional clinical judgment regarding those findings and how the interpretation influenced diagnosis, treatment, or disposition"></textarea>
                        
                        <h4>Assessment & Plan</h4>
                        <textarea data-pretext="<u>Assessment & Plan:</u>" placeholder="Include specific observations noted based on visualizing the image(s)"></textarea>
                        
                    </div>

                    <div data-section="ConsultantDiscussion">
                        <h3 >Consultant Discussionn</h3>
                        <button data-text="I have discussed the care with the hospitalist who has agreed to admit the patient">hospitalist admit</button>
                        <button data-text="I have spoken with the patient's primary care provider team about appropriate outpatient follow-up">PCP f/u</button>
                        <button data-text="I have discussed with specialty consultants about active management of the patient">consultant</button>
                        <button data-text="I have discussed with mental health providers about active care of the patient">mental health</button>
                        <button data-text="I have medical management of the patient with pharmacist">pharmacy</button>
                        <button data-text="I have discussed disposition planning with physical therapy and/or case management">PT/CM</button>
                        <textarea placeholder="Describe discussions with medical consultants about the care of the patient."></textarea>
                    </div>
                </div>
            </details>

            <!-- Risk of Patient Management (open by default) -->
            <details id="secRisk" open>
                <summary>
                    <strong><i style="font-size: 1.2em">Risk of Patient Management</i></strong>
                </summary>
                <div class="section-body">
                    <div data-section="Risk">
                        <h2 >Independent Historian</h2>
                        <button data-text="I considered escalation of patient\u2019s care including consideration of admission or transfer">escalation of care considered</button>
                        <button data-text="management of the patient included the prescription of medications for ongoing care">rx management</button>
                        <button data-text="management included the use of parenteral controlled substances for pain and/or anxiety management">parenteral controlled substance</button>
                        <button data-text="drug therapy was administered that required intensive monitoring for toxicity">IV drug therapy</button>
                        <button data-text="hospitalization and/or escalation of care was considered in management of the patient">hospitalization decision</button>
                        <button data-text="management of the patient included the discussion and consideration of elective or emergent surgery">surgery</button>
                        <button data-text="management of the patient included consideration of social determinants of health which impacted care and disposition planning">SDOH</button>
                        <button data-text="decision was made to not resuscitate or de-escalate care because of poor prognosis">de-escalation</button>
                        <button data-text="clinical decision tools were used in patient management to determine appropriateness of diagnostic workup">clinical decision tools</button>
                        <textarea placeholder=""></textarea>
                    </div>
                </div>
            </details>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <div id="outputArea"></div>
            <button onclick="copyOutput()">Copy to Clipboard</button>
            <button onclick="clearOutput()">Clear</button>
        </div>
    </div>

    <footer></footer>

    <script src="jstest/general.js"></script>

</body>
</html>
