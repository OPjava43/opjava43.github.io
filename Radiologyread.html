<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiology Interpretation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html#home">Home</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <div class="form-section">
            <h2 class="title">Radiology Interpretation</h2>
            
            <!-- Imaging Type Section -->
            <div data-section="Imaging type">
                <h3>Imaging type</h3>
                <button data-text="X-ray">XR</button>
                <button data-text="CT scan without contrast">CT w/o</button>
                <button data-text="CT scan with contrast">CT w/</button>
                <button data-text="MRI">MRI</button>
                <button data-text="ultrasound">US</button>
                <button data-text="head">head</button>
                <button data-text="neck">neck</button>
                <button data-text="chest">chest</button>
                <button data-text="abdomen and pelvis">abdomen/pelvis</button>
                <button data-text="C-spine">C-spine</button>
                <button data-text="T-spine">T-spine</button>
                <button data-text="L-spine">L-spine</button>
                <button data-text="upper extremity">upper extremity</button>
                <button data-text="lower extremity">lower extremity</button>
                <textarea id="ImagingTypeText" placeholder="" onchange="updateRealTimeText('Imaging type', 'ImagingTypeText')"></textarea>
            </div>

            <!-- Time of Interpretation Section -->
            <div data-section="Interpretationtime">
                <h3>Time of interpretation</h3>
                <button onclick="timeNow('interpretationTimeText')" data-display = "false">Now</button>
                <textarea id="interpretationTimeText"></textarea>
            </div>

            <!-- Interpretation Sections -->
            <div data-section="Interpretation/Findings">
                <h3>Interpretation/Findings</h3>
                <!-- Head Findings -->
                <i>Head</i>
                <button data-text="no acute bleed noted">neg bleed</button>
                <button data-text="no shift noted">neg shift</button>
                <button data-text="normal sized ventricles noted">normal ventricles</button>
                
                <!-- Spine Findings -->
                <br><i>Spine</i>
                <button data-text="no acute fracture">neg fracture</button>
                <button data-text="no retropulsion">neg retropulsion</button>
                
                <!-- Chest Findings -->
                <br><i>Chest</i>
                <button data-text="no pneumonia identified">neg PNA</button>
                <button data-text="no pneumothorax noted">neg PTX</button>
                <button data-text="normal mediastinum">normal mediastinum</button>
                <button data-text="no signs of pulmonary edema">neg pulm edema</button>
                <button data-text="no significant PE noted">neg PE</button>
                
                
                <!-- Abdomen Findings -->
                <br><i>Abdomen</i>
                <button data-text="no acute obstruction">neg obstruction</button>
                <button data-text="no fat stranding or abscess noted, reassuring against infection">neg infection</button>
                <button data-text="no hydronephrosis noted">neg hydronephrosis</button>
                <button data-text="no kidney stones noted">neg kidney stones</button>
                
                <!-- Extremity Findings -->
                <br><i>Extremity</i>
                <button data-text="no acute fracture or dislocation">neg fracture/dislocation</button>
                <button data-text="veins are compressible with no signs of DVT">neg DVT</button>
                
                <textarea placeholder=""></textarea>
                <h4>Specific Observations</h4>
                <textarea placeholder="Include specific observations noted based on visualizing the image(s)"></textarea>
            </div>
            
            <div data-section="Assessment/Plan">
                <h3>Assessment & Plan</h3>
                <textarea style = "min-height: 54px;" placeholder="Professional clinical judgment regarding those findings and how the interpretation influenced diagnosis, treatment, or disposition"></textarea>
            </div>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <div id="outputArea"></div>
            <button onclick="copyOutput()">Copy to Clipboard</button>
            <button onclick="clearOutput()">Clear</button>
        </div>
    </div>

     <footer>
    </footer>

    <script src="jstest/general.js"></script>
    <script src="jstest/present.js"></script>
</body>
</html>
